[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "izlek"
version = "1.0.0"
description = "Yerel öncelikli film ve dizi takip masaüstü uygulaması"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "İzlek contributors" }]
keywords = ["film", "dizi", "masaüstü", "takip"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PySide6>=6.8,<7",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "keyring>=25,<27",
]

[project.urls]
Homepage = "https://github.com/Teknoloji-Filozoflari/Izlek"
Repository = "https://github.com/Teknoloji-Filozoflari/Izlek"
Issues = "https://github.com/Teknoloji-Filozoflari/Izlek/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
package = ["pyinstaller>=6.11,<7"]

[project.scripts]
izlek = "izlek.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
izlek = [
    "ui/qml/**/*.qml",
    "ui/qml/**/qmldir",
    "resources/icons/*.svg",
    "resources/desktop/*.desktop",
    "resources/images/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:GLib\\.unix_signal_add_full is deprecated; use GLibUnix\\.signal_add_full instead:gi.PyGIDeprecationWarning",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
