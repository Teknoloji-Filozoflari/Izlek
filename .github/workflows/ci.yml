name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libxkbcommon-x11-0
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run pytest with mock-only network policy
        run: python -m pytest
      - name: Build installable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
