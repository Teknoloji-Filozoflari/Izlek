name: Publish verified Linux packages

on:
  workflow_dispatch:
    inputs:
      appimage_run:
        description: Verified AppImage build run ID
        required: true
        type: string
      deb_run:
        description: Verified DEB build run ID
        required: true
        type: string
      rpm_run:
        description: Verified RPM build run ID
        required: true
        type: string
      snap_run:
        description: Verified Snap build run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-verified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.appimage_run }}
          name: izlek-appimage-x86_64
          github-token: ${{ github.token }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.deb_run }}
          name: izlek-deb-amd64
          github-token: ${{ github.token }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.rpm_run }}
          name: izlek-rpm-x86_64
          github-token: ${{ github.token }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.snap_run }}
          name: izlek-snap-amd64
          github-token: ${{ github.token }}
          path: release-assets
      - name: Build Python distributions and source archive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --outdir release-assets
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test -f "docs/release-notes/v$version.md"
          test -f "release-assets/Izlek-$version-x86_64.AppImage"
          test -f "release-assets/izlek_${version}_amd64.deb"
          test -f "release-assets/izlek-$version-1.fc43.x86_64.rpm"
          test -f "release-assets/izlek_${version}_amd64.snap"
          git archive --format=tar.gz --prefix="izlek-$version/" \
            --output="release-assets/Izlek-$version-source.tar.gz" HEAD
          cd release-assets
          sha256sum --check "Izlek-$version-x86_64.AppImage.sha256"
          sha256sum * > SHA256SUMS
      - name: Publish release with verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          gh release create "v$version" --target "$GITHUB_SHA" --draft \
            --title "İzlek v$version" --notes-file "docs/release-notes/v$version.md" \
            release-assets/*
          gh release edit "v$version" --draft=false --latest
