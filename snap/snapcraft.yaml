name: izlek
version: '1.0.1'
base: core24
summary: Yerel film ve dizi takip uygulaması
description: |
  Film, dizi, bölüm ilerlemesi ve listelerinizi cihazınızda takip edin.
  İçerik bilgileri için kullanıcının kendi TMDB API Read Access Tokenı gerekir.
grade: devel
confinement: strict
license: GPL-3.0-or-later
platforms:
  amd64:

apps:
  izlek:
    command: bin/izlek-launcher
    desktop: usr/share/applications/izlek.desktop
    plugs:
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - home
      - password-manager-service
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/lib/x86_64-linux-gnu
      FONTCONFIG_PATH: $SNAP/etc/fonts
      FONTCONFIG_FILE: $SNAP/etc/fonts/fonts.conf

parts:
  izlek:
    plugin: nil
    source: .
    build-packages:
      - python3-venv
      - gcc
      - binutils
      - libegl1
      - libgl1
      - libglib2.0-0t64
      - libdbus-1-3
      - libfontconfig1
      - libxkbcommon-x11-0
    stage-packages:
      - libegl1
      - libgl1
      - libgl1-mesa-dri
      - libglib2.0-0t64
      - libfontconfig1
      - fonts-dejavu-core
      - libdbus-1-3
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-randr0
      - libxcb-render0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxkbcommon0
      - libxkbcommon-x11-0
    override-build: |
      python3 -m venv "$CRAFT_PART_BUILD/.package-venv"
      "$CRAFT_PART_BUILD/.package-venv/bin/python" -m pip install \
        --constraint packaging/constraints-appimage.txt '.[dev,package]'
      "$CRAFT_PART_BUILD/.package-venv/bin/python" scripts/quality.py
      "$CRAFT_PART_BUILD/.package-venv/bin/python" scripts/build_appimage.py --appdir-only
      install -d "$CRAFT_PART_INSTALL/usr/lib/izlek" "$CRAFT_PART_INSTALL/bin"
      cp -a dist/izlek/. "$CRAFT_PART_INSTALL/usr/lib/izlek/"
      install -m755 snap/local/izlek-launcher "$CRAFT_PART_INSTALL/bin/izlek-launcher"
      install -Dm644 src/izlek/resources/desktop/izlek.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/izlek.desktop"
      install -Dm644 src/izlek/resources/icons/izlek.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/izlek.svg"
      sed -i 's|^Icon=izlek$|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/izlek.svg|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/izlek.desktop"
